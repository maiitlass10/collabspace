# Optional: PostgreSQL for local development.
# Credentials here are for local development only — never reuse them in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: collabspace
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: collabspace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

# nginx in front of CollabSpace (used by docker-compose.yml).
upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;  # WebSocket messages are limited to 5 MB by Django

    root /usr/share/nginx/html;
    index index.html;

    # REST API, admin and the admin's static files -> Django
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time editing (WebSocket upgrade) -> Django Channels
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;  # keep idle editors connected
    }

    # Hashed JS/CSS files never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path is handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
